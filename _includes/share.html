{% assign share_url = page.url | absolute_url | url_encode %}
{% assign share_title = page.title | url_encode %}
<div class="share">
  <span>Share this</span>
  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url }}" rel="noopener">LinkedIn</a>
  <a href="https://twitter.com/intent/tweet?url={{ share_url }}&amp;text={{ share_title }}" rel="noopener">X</a>
  <a href="https://www.facebook.com/sharer/sharer.php?u={{ share_url }}" rel="noopener">Facebook</a>
  <button type="button" data-copy="{{ page.url | absolute_url }}" hidden>Copy link</button>
</div>
