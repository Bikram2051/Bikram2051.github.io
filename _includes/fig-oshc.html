<figure class="figure">
  <figcaption class="figure__title">No answer is released until it passes three checks</figcaption>
  <ol class="flow" data-loop style="--n: 5">
    <li style="--i: 0"><b>Student asks a question</b><span>Personal details are screened out</span></li>
    <li style="--i: 1"><b>Input review</b></li>
    <li style="--i: 2"><b>Grounded draft</b><span>Written from the source guide</span></li>
    <li style="--i: 3"><b>Output audit</b><span>Citations checked against the source PDF</span></li>
    <li style="--i: 4" class="is-out"><b>Cited answer released</b></li>
  </ol>
  <p class="flow__aside">If any step fails, the student gets a fixed abstention, not a guess.</p>
</figure>
