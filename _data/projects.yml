  - id: bank-loan
    title: Bank loan portfolio dashboard
    context: Personal project.
    image: /assets/projects/bank-loan.webp
    image_alt: Bank loan summary dashboard in Tableau, with applications, funded amount and good and bad loan splits
    short: Headline lending KPIs written in SQL Server, shown in three linked Tableau dashboards and checked back against the SQL.
