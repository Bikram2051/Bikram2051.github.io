# The four projects shown with a figure, in order
featured:
  - id: crash-weight
    title: Vehicle weight and driver injury in two-car crashes
    context: "Team of two, Swinburne (COS80023 Big Data), 2026. My part: building the data, the models and the figures."
    figure: fig-curve.html
    summary: >-
      When two cars collide, how much does weight decide which driver is killed or seriously injured?
      We compared the two drivers inside each of 57,217 Victorian crashes, so the road, the weather and
      the speed limit cancel out. After adjusting for driver age and sex, vehicle age, seatbelt use and
      point of impact, each 10% of extra weight went with about 20% lower odds for that car's driver.
    more:
      - >-
        The plan said to model weight per 100 kg. I tested that straight line before trusting it, found it
        understated the risk for light cars, and switched to the ratio of the two weights. The confounder
        we expected was vehicle age. It turned out to be driver sex.
    tools: R, survival (conditional logistic regression), dplyr, ggplot2
    links:
      - label: Read the case study
        url: /projects/crash-weight/
      - label: Read the article
        url: /articles/2026/what-57217-crashes-say-about-car-weight/

  - id: oshc
    title: OSHC When It Matters
    context: "Team project, Swinburne (COS70008), 2026. Industry partner: Medibank. My part: extraction, arithmetic and evaluation."
    figure: fig-oshc.html
    summary: >-
      A learning prototype that helps international students make sense of their Overseas Student Health
      Cover: short sourced lessons, practical steps for finding care, a bill explainer that works on
      synthetic invoices, and a guarded chat. The chat was the hard part. Every answer goes through an
      input review, a grounded draft and an output audit, and its citations are checked against the source PDF.
    more:
      - >-
        My part was the bill explainer's extraction, the benefit and MBS arithmetic, the question classifier
        and the evaluation code. The arithmetic had its tests written before the code, because it is money.
        We also designed the evaluation so that nobody builds against the held-out set they are scored on.
    tools: Python, Streamlit, Claude Haiku (Anthropic API), pytest
    links:
      - label: Read the article
        url: /articles/2026/the-file-i-am-not-allowed-to-read/
      - label: View the repository
        url: https://github.com/Bikram2051/oshc-when-it-matters

  - id: survey-platform
    title: Survey platform
    context: "Backend MVP for survey and field data collection, built for the Nepal market."
    figure: fig-survey.html
    summary: >-
      The backend for a multi-tenant survey platform: versioned questionnaires in English and Nepali,
      offline sync for field teams, and a public link for self-response. Each client's data is kept apart
      by Postgres row-level security, so isolation is enforced by the database and proven by tests.
    more:
      - >-
        The statistics layer rakes responses to census margins, then reports Kish effective sample sizes,
        standard errors and design effects, so no estimate leaves the API as a bare percentage.
        Self-selected responses stay out of estimates unless someone forces them in, and then they carry a warning.
    tools: Python, Django REST Framework, PostgreSQL, Docker, pytest
    links:
      - label: View the repository
        url: https://github.com/Bikram2051/survey-platform

  - id: sentiment
    title: Domain adaptive sentiment analysis
    context: "Team project, Swinburne, completed. My role: data engineer."
    figure: fig-sentiment.html
    summary: >-
      A sentiment model that had to work across two very different kinds of writing: casual Reddit
      comments and formal financial reporting. I owned the data side: pulling in GoEmotions and the
      Financial PhraseBank, writing the cleaning and standardisation steps so both corpora came out in a
      consistent shape, and producing the train, validation and test splits the modelling work ran on.
    more:
      - >-
        The team used those splits to fine-tune BERT (bert-base-uncased) in three ways, and built a Streamlit dashboard that displayed the metrics.
    tools: Python, pandas, Hugging Face, BERT
    links:
      - label: Read the article
        url: /articles/2026/the-98-9-percent-score-that-was-a-bug/
      - label: View the repository
        url: https://github.com/TDP-2026-Repository/TECHNOLOGY-DESIGN-PROJECT

