  - id: bankruptcy
    title: Company bankruptcy prediction
    context: Personal project, using the UCI Polish companies dataset.
    short: 64 financial ratios and very few failures. SMOTE and cost sensitive learning, judged on recall and ROC AUC.
    body: >-
      A classification problem with a heavy imbalance: five yearly snapshots, 64 financial ratios, and
      very few insolvent companies to learn from. I handled the imbalance with SMOTE and cost sensitive
      learning, then compared logistic regression, random forest and gradient boosting. Recall and ROC AUC
      mattered more than plain accuracy here, since missing a company that goes under is far more expensive
      than a false alarm. The feature importances lined up with the liquidity and leverage ratios you would expect.
    tools: Python, scikit-learn, imbalanced-learn

